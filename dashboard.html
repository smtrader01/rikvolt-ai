<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angel AI - Elite Trading Panel</title>
    <!-- FontAwesome Premium Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Modern Native Dark UI Grid - Guaranteed Mobile Responsive */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            overflow-x: hidden;
            overflow-y: auto !important;
            min-height: 100vh;
        }
        body { 
            background: linear-gradient(135deg, #090d16 0%, #0f172a 100%);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 15px;
        }
        .container { max-width: 1100px; margin: 0 auto; width: 100%; padding-bottom: 120px; }
        
        /* Elite Top Bar Header */
        .top-bar {
            background: #151c2c;
            border: 1px solid #222e45;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        @media(min-width: 768px) {
            .top-bar { flex-direction: row; justify-content: space-between; align-items: center; }
        }
        .brand-title {
            font-size: 20px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }
        .admin-sub { font-size: 11px; color: #94a3b8; margin-top: 4px; }
        
        /* Elite Controls Area */
        .controls-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; width: 100%; }
        @media(min-width: 768px) { .controls-group { width: auto; } }
        
        .mode-badge {
            background: #0f1524;
            border: 1px solid #222e45;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            color: #f59e0b;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Custom Premium Toggle Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ff9100; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #00e676; }
        input:checked + .slider:before { transform: translateX(22px); }

        .panic-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
        }
        .panic-btn:active { transform: scale(0.95); }

        /* Multi-Column Main Dashboard Layout */
        .main-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 992px) {
            .main-grid { grid-template-columns: 1fr 2fr; }
        }

        /* Responsive Cards Template */
        .card {
            background: #151c2c;
            border: 1px solid #222e45;
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }
        .card-title-cyan { font-size: 13px; font-weight: 800; color: #38bdf8; text-transform: uppercase; tracking-wider; }
        .card-title-indigo { font-size: 13px; font-weight: 800; color: #818cf8; text-transform: uppercase; tracking-wider; }
        .card-title-emerald { font-size: 13px; font-weight: 800; color: #34d399; text-transform: uppercase; tracking-wider; }
        
        .desc-text { font-size: 11px; color: #94a3b8; line-height: 1.5; }
        
        .input-row { display: flex; gap: 8px; width: 100%; }
        input[type="number"], input[type="password"], select {
            flex: 1;
            background: #0f1524;
            border: 1px solid #222e45;
            padding: 12px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
            font-weight: 600;
            width: 100%;
        }
        
        .btn-action {
            background: #0ea5e9;
            color: #0f172a;
            font-weight: 700;
            border: none;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-gradient {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: white;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
        }

        /* Stats Blocks Architecture */
        .stats-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 10px; }
        @media(min-width: 576px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
        
        .stat-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #222e45;
            padding: 20px;
            border-radius: 16px;
        }
        .stat-label { font-size: 11px; color: #94a3b8; font-weight: 600; }
        .stat-val-green { font-size: 26px; font-weight: 900; color: #4ade80; margin-top: 8px; }
        .stat-val-amber { font-size: 26px; font-weight: 900; color: #fbbf24; margin-top: 8px; }
        
        /* Activity Stream Window */
        .terminal-box {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 14px;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.6;
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        /* Floating Angel AI Interface Module - LOCKED TO VIEWPORT */
        .angel-widget { 
            position: fixed; 
            bottom: 25px; 
            right: 25px; 
            z-index: 999999 !important; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-end; 
            gap: 12px; 
        }
        .chat-bubble {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 30px rgba(245, 158, 11, 0.6);
            transition: all 0.3s ease;
        }
        .chat-bubble:active { transform: scale(0.9); }
        .chat-bubble i { color: #0f172a; font-size: 24px; }
        
        .chat-win {
            width: 320px;
            height: 440px;
            background: #151c2c;
            border: 1px solid #222e45;
            border-radius: 16px;
            box-shadow: 0 12px 45px rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        @media(min-width: 420px) { .chat-win { width: 365px; } }
        
        .chat-head { background: #1e293b; padding: 14px 15px; border-bottom: 1px solid #222e45; display: flex; justify-content: space-between; align-items: center; }
        .chat-head-info { display: flex; align-items: center; gap: 8px; }
        .online-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 12px; }
        
        .msg-node { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; }
        .msg-node.bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-node.user { background: #fbbf24; color: #0f172a; align-self: flex-end; border-bottom-right-radius: 2px; font-weight: 600; }
        
        .chat-foot { padding: 12px; background: #020617; border-top: 1px solid #222e45; display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Elite Top Bar Header -->
        <div class="top-bar">
            <div>
                <div class="brand-title">👑 Project Angel AI Control</div>
                <div class="admin-sub">স্বাগতম, Rik | রোল: প্রধান অ্যাডমিন ও মালিক</div>
            </div>
            
            <div class="controls-group">
                <div class="mode-badge">
                    <span id="mode-text"><i class="fa-solid fa-flask"></i> ডেমো মোড (Sandbox)</span>
                    <label class="switch">
                        <input type="checkbox" id="modeToggle" onchange="toggleTradingMode()">
                        <span class="slider"></span>
                    </label>
                </div>
                <button class="panic-btn" onclick="activatePanicButton()"><i class="fa-solid fa-triangle-exclamation"></i> Emergency</button>
            </div>
        </div>

        <!-- Main Dashboard Layout -->
        <div class="main-grid">
            
            <!-- LEFT COLUMN -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="card">
